spring:
  application:
    name: safra-confirmacao
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # Credenciais somente por variável de ambiente; nenhum valor padrão para usuário ou senha.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safra}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: safra-confirmacao
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 2000
      validation-timeout: 1500
      # Não falha a inicialização sem banco; a readiness reflete a indisponibilidade.
      initialization-fail-timeout: -1
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
