# Infraestrutura local do SAFRA Online: PostgreSQL, API SAFRA (Node.js) e Serviço de Confirmação (Java).
# `docker compose up -d` sobe os três. A API também pode rodar na máquina (npm start); nesse caso,
# não suba o serviço `api` ao mesmo tempo na mesma porta.
# Configuração lida do .env (mesmo arquivo usado pelo Node). Veja .env.example.
name: safra

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME:-safra}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      # Somente na interface local: o Node da máquina acessa localhost:DB_PORT.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - safra

  confirmacao-java:
    build:
      context: ./services/confirmacao-java
    image: safra/confirmacao-java:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${JAVA_SERVER_PORT:-8080}
      # Dentro da rede do Compose o banco é o serviço "postgres", na porta interna 5432.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-safra}
      DB_USER: ${DB_USER:?Defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${JAVA_PORT:-8080}:${JAVA_SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - safra

  api:
    build:
      context: .
    image: safra/api:0.2.0
    environment:
      NODE_ENV: ${API_NODE_ENV:-development}
      PORT: 4000
      # Dentro da rede do Compose: banco em postgres:5432.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-safra}
      DB_USER: ${DB_USER:?Defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006}
      # CT16: o Serviço de Confirmação é acessado pelo nome do serviço na rede interna.
      CONFIRMACAO_URL: http://confirmacao-java:${JAVA_SERVER_PORT:-8080}
    ports:
      # Padrão só na máquina. Para testar no celular pela rede local, defina API_BIND_ADDRESS=0.0.0.0 no .env.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      # A API inicia mesmo sem o Java; a confirmação responde 503 enquanto ele estiver indisponível.
      confirmacao-java:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - safra

volumes:
  pgdata:
    name: safra-pgdata

networks:
  safra:
    name: safra-net
