# Infraestrutura local do SAFRA Online: PostgreSQL e Serviço de Confirmação em Java.
# O backend Node.js roda na máquina e acessa os dois serviços pelas portas publicadas em 127.0.0.1.
# Configuração lida do .env (mesmo arquivo usado pelo Node). Veja .env.example.
name: safra

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME:-safra}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      # Somente na interface local: o Node da máquina acessa localhost:DB_PORT.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - safra

  confirmacao-java:
    build:
      context: ./services/confirmacao-java
    image: safra/confirmacao-java:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${JAVA_SERVER_PORT:-8080}
      # Dentro da rede do Compose o banco é o serviço "postgres", na porta interna 5432.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-safra}
      DB_USER: ${DB_USER:?Defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${JAVA_PORT:-8080}:${JAVA_SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - safra

volumes:
  pgdata:
    name: safra-pgdata

networks:
  safra:
    name: safra-net
